[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hik-sensors"
version = "0.1.0"
description = "Unified extensible sensor stack (MegaCollect / hik_gello refactor)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
zmq = ["pyzmq>=25.0"]
realsense = ["pyrealsense2>=2.54"]
dynamixel = ["dynamixel-sdk>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = ["hik-sensors[serial,zmq,realsense,dynamixel,dev]"]

[project.scripts]
sensors = "sensors.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
