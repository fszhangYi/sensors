# Thick M2 Phase C — STL clouds on FK frames (optional).
# Set mesh_root to sensors-arm static/models/cs66 (or SENSORS_TRAJ_SAFETY_MESH_ROOT).
# Falls back to sphere/capsule profile behavior if STLs are missing.
id: elite_cs66_mesh
kinematics_profile_id: elite_cs66
method: hull
table_z: 0.0
table_clearance_m: 0.01
self_min_dist_m: 0.02
skip_adjacent: 1
near_miss_margin_m: 0.015
up_axis: z
max_events: 40
mesh_root: null

# Keep sphere fallbacks if mesh files absent.
links:
  - { name: base, link_index: 0, radius_m: 0.08, offset_m: [0.0, 0.0, 0.05] }
  - { name: j1, link_index: 1, radius_m: 0.07, offset_m: [0.0, 0.0, 0.0] }
  - { name: j2, link_index: 2, radius_m: 0.06, offset_m: [0.0, 0.0, 0.0] }
  - { name: j3, link_index: 3, radius_m: 0.055, offset_m: [0.0, 0.0, 0.0] }
  - { name: j4, link_index: 4, radius_m: 0.045, offset_m: [0.0, 0.0, 0.0] }
  - { name: j5, link_index: 5, radius_m: 0.04, offset_m: [0.0, 0.0, 0.0] }
  - { name: flange, link_index: 6, radius_m: 0.04, offset_m: [0.0, 0.0, 0.0] }

meshes:
  - { name: base_link, link_index: 0, stl: meshes/base_link.STL, max_points: 28 }
  - { name: link1, link_index: 1, stl: meshes/link1.STL, max_points: 28 }
  - { name: link2, link_index: 2, stl: meshes/link2.STL, max_points: 24 }
  - { name: link3, link_index: 3, stl: meshes/link3.STL, max_points: 24 }
  - { name: link4, link_index: 4, stl: meshes/link4.STL, max_points: 20 }
  - { name: link5, link_index: 5, stl: meshes/link5.STL, max_points: 20 }
  - { name: link6, link_index: 6, stl: meshes/link6.STL, max_points: 20 }
