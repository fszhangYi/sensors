# Geometric safety proxies for Elite CS66 (thick M2 Phase B).
# Link indices: 0=base, 1..6 = after J1..J6 (flange). Radii are conservative
# placeholders — refine from mesh/URDF later (Phase C).
id: elite_cs66
kinematics_profile_id: elite_cs66
method: sphere
table_z: 0.0
table_clearance_m: 0.01
self_min_dist_m: 0.025
skip_adjacent: 1
near_miss_margin_m: 0.015
up_axis: z
max_events: 40

# Sphere centers at link-frame origins (+ optional offset in that frame).
links:
  - { name: base, link_index: 0, radius_m: 0.08, offset_m: [0.0, 0.0, 0.05] }
  - { name: j1, link_index: 1, radius_m: 0.07, offset_m: [0.0, 0.0, 0.0] }
  - { name: j2, link_index: 2, radius_m: 0.06, offset_m: [0.0, 0.0, 0.0] }
  - { name: j3, link_index: 3, radius_m: 0.055, offset_m: [0.0, 0.0, 0.0] }
  - { name: j4, link_index: 4, radius_m: 0.045, offset_m: [0.0, 0.0, 0.0] }
  - { name: j5, link_index: 5, radius_m: 0.04, offset_m: [0.0, 0.0, 0.0] }
  - { name: flange, link_index: 6, radius_m: 0.04, offset_m: [0.0, 0.0, 0.0] }

# Extra samples along long segments (capsule-like).
capsules:
  - name: upper_arm
    from_link_index: 2
    to_link_index: 3
    radius_m: 0.055
    samples: 3
  - name: forearm
    from_link_index: 3
    to_link_index: 4
    radius_m: 0.045
    samples: 3
